name: qltc Portal & Receipt Verification CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-portal-receipts:
    name: Cryptographic SHA-256, ML-DSA-65, 32-PCN Twin & DCB0129 Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv & Python 3.12
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install numpy, scipy, dilithium-py & networkx
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python "numpy>=1.26" "scipy>=1.13" "dilithium-py>=1.2" "networkx>=3.2"

      - name: Verify 19 provenance artifacts, ML-DSA-65 envelopes, 15 FCIDUMPs, 75-node KG, 32-PCN UK OGL v3.0 twin & 3 PDFs
        run: |
          .venv/bin/python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          import networkx as nx
          from dilithium_py.ml_dsa import ML_DSA_65

          root = Path(".")
          data = json.loads((root / "assets" / "data.json").read_text())
          prov = data["receipts_summary"]
          assert len(prov) >= 20, f"Expected >=20 provenance entries, got {len(prov)}"

          verified_receipts = 0
          verified_pqc = 0
          for entry in prov:
              p = root / "receipts" / entry["file"]
              assert p.exists(), f"Missing receipt {p}"
              obj = json.loads(p.read_text())
              rec_sha = obj.get("receipt_sha256")
              assert isinstance(rec_sha, str) and len(rec_sha) == 64, f"Missing receipt_sha256 in {p}"
              body = {k: v for k, v in obj.items() if k != "receipt_sha256"}
              valid = {
                  hashlib.sha256(json.dumps(body, sort_keys=True).encode()).hexdigest(),
                  hashlib.sha256(json.dumps(body, sort_keys=True, separators=(",", ":")).encode()).hexdigest(),
              }
              assert rec_sha in valid, f"Canonical SHA-256 mismatch in {p}"
              verified_receipts += 1

              if "ml_dsa_65_envelope" in obj:
                  env = obj["ml_dsa_65_envelope"]
                  assert env.get("algorithm") == "NIST-FIPS-204-ML-DSA-65"
                  assert int(env.get("signature_bytes", 0)) == 3309
                  pre = {k: v for k, v in obj.items() if k not in ("ml_dsa_65_envelope", "receipt_sha256")}
                  digest = hashlib.sha256(json.dumps(pre, sort_keys=True).encode()).digest()
                  if "signed_digest_sha256" in env:
                      assert env["signed_digest_sha256"] == digest.hex()
                  if "public_key_b64" in env and "signature_b64" in env:
                      assert ML_DSA_65.verify(
                          base64.b64decode(env["public_key_b64"]),
                          digest,
                          base64.b64decode(env["signature_b64"]),
                      )
                  verified_pqc += 1

              for k in ("epistemic_demarcation", "epistemic_governance", "data_governance_and_attribution"):
                  blk = obj.get(k)
                  if isinstance(blk, dict):
                      for qk in ("physical_hardware_shots", "physical_qpu_shots"):
                          if qk in blk:
                              assert int(blk[qk]) == 0
                      if "phi_present" in blk:
                          assert blk["phi_present"] is False

          # 32-PCN Real NHS Twin (UK OGL v3.0)
          twin = json.loads((root / "receipts" / "ncl_icb_real_pcn_twin_2026.json").read_text())
          twin_copy = {k: v for k, v in twin.items() if k != "snapshot_sha256"}
          twin_sha = hashlib.sha256(
              json.dumps(twin_copy, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          assert twin_sha == twin["snapshot_sha256"], "32-PCN twin SHA-256 mismatch"
          assert len(twin["pcns"]) == 32 and twin["total_registered_patients"] == 1810301
          assert twin["phi_present"] is False and "Open Government Licence v3.0" in json.dumps(twin)

          # 76-Node / 236-Triple Connected KG
          kg = json.loads((root / "receipts" / "quantum_ltc_knowledge_graph.json").read_text())
          g = nx.Graph()
          for n in kg["nodes"]:
              g.add_node(n["id"])
          for e in kg["edges"]:
              g.add_edge(e["source"], e["target"])
          assert len(kg["nodes"]) == 76 and len(kg["edges"]) == 236
          assert nx.number_connected_components(g) == 1

          # 15 OpenCYP-FTQC v1.2 FCIDUMPs + 3 Compiled Samskrift PDFs
          fcidumps = list((root / "opencyp_ftqc").rglob("*.fcidump.gz"))
          assert len(fcidumps) == 15, f"Expected 15 FCIDUMPs, got {len(fcidumps)}"
          for pdf_name in ["Quantum_LTC_Roadmap.pdf", "Clinical_Quantum_World_Model_Paper.pdf", "Clinical_SwarmWorld_Paper.pdf"]:
              pdf_path = root / "downloads" / pdf_name
              assert pdf_path.exists() and pdf_path.stat().st_size > 500_000, f"Missing/empty PDF {pdf_path}"

          print(f"[qltc-portal-ci] PASS — {verified_receipts} SHA-256 receipts, {verified_pqc} ML-DSA-65 envelopes, 15 FCIDUMPs, 75-node KG, 32-PCN UK OGL v3.0 twin & 3 PDFs verified.")
          PY

      - name: Verify External Benchmark Submissions & Pull Request Gate (8-seed replay + AST sandbox + ML-DSA-65)
        run: .venv/bin/python submissions/evaluate_submission.py --verify-all
